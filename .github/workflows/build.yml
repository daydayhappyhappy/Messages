name: Build Custom Right Messages

on:
  workflow_dispatch:
    inputs:
      date_format:
        description: '日期格式  M-d-yyyy=9-11-2026(月在前) / d-M-yyyy=11-9-2026(日在前) / yyyy-MM-dd=2026-09-11'
        required: true
        default: 'M-d-yyyy'
      date_mode:
        description: 'full=所有短信统一显示日期(今天也显示日期) / keep-year=今天仍显示时间, 但不再隐藏年份'
        type: choice
        options: [full, keep-year]
        default: full
      flavor:
        description: '构建渠道。只留 foss(无 Google 内购), 避免误选 gplay/rustore 引入内购入口'
        type: choice
        options: [foss]
        default: foss
      package_name:
        description: '改包名 (如 com.mycompany.sms)。留空=保持 com.goodwy.smsmessenger。改后与官方版可共存安装'
        required: false
        default: ''
      commons_ref:
        description: 'commons 分支/commit。留空=自动用 app 锁定的那个 commit(推荐)。一般情况下不需要改'
        required: false
        default: ''
      locales:
        description: '语言白名单(逗号分隔, 默认 zh-rCN)。例如 zh-rCN,en'
        required: false
        default: ''
      trim_langs:
        description: '语言精简: 只保留简体中文(中国), 删除其余所有语种(含繁体)'
        type: boolean
        default: true
      locale_filters:
        description: '用 localeFilters 剔掉 AAR(androidx) 带来的重复语言项, 让系统"应用语言"列表只剩中文(中国)'
        type: boolean
        default: true
      strip_about:
        description: '去掉主界面/设置页的「关于」入口, 并把关于页(FAQ/邮箱/GitHub/捐赠/隐私政策/许可)整个空壳化'
        type: boolean
        default: true
      hide_datefmt:
        description: '隐藏设置页「更改日期和时间格式」入口 (日期已全仓统一, 留着只会让人改回去)'
        type: boolean
        default: true
      abi_trim:
        description: '只打 64 位 ARM (arm64-v8a), 剔除其它架构的 .so'
        type: boolean
        default: true
      device_trim:
        description: '只保留手机资源, 删除平板/电视/车机专用目录与低密度位图'
        type: boolean
        default: true
      italic_fix:
        description: '应用内所有斜体 (textStyle=italic / Typeface.ITALIC) 改成默认正体'
        type: boolean
        default: true
      purchase_trim:
        description: '删除设置页「购买 Thank You」卡片与「小费罐 / Tip Jar」'
        type: boolean
        default: true
      google_trim:
        description: '移除 play-services-location 依赖, 打开 hide_google_relations 开关'
        type: boolean
        default: true
      sideload_trim:
        description: '去掉签名认证弹窗 (否则自编译版会弹「应用已损坏, 请从商店重新下载」)'
        type: boolean
        default: true
      dialog_trim:
        description: '去掉更新日志 / 新应用推荐 / 数据访问披露三类弹窗, 并隐藏设置页「其他」分组'
        type: boolean
        default: true
      unlock_pro:
        description: '解锁全部付费功能 (isPro 恒 true: 去掉「已锁定」标签/变灰, 解锁自定义颜色等)'
        type: boolean
        default: true
      keep_purchase_page:
        description: '保留 foss 的项目支持页 (默认 false = 空壳化, 因为入口已隐藏且无需购买)'
        type: boolean
        default: false
      keep_speech:
        description: '保留语音输入 (默认 false = 彻底删除: 设置项 + 麦克风按钮 + 长按 + 结果回填)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Messages
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Preflight (检查脚本是否随仓库提交)
        run: |
          set -e
          if [ ! -f "$GITHUB_WORKSPACE/patch_goodwy.py" ]; then
            echo "::error::仓库根目录缺少 patch_goodwy.py, 请把它一起提交上来"
            exit 1
          fi
          # 防呆: 收尾模块没接进去的话, 会编出"签名弹窗复活 + 购买页还在"的 APK,
          # 与其装到手机上才发现, 不如在这里就拦下来。
          if ! grep -q 'def patch_final_clean' patch_goodwy.py; then
            echo "::error::patch_goodwy.py 里没有 patch_final_clean 定义, 收尾清理不会执行"
            exit 1
          fi
          CNT=$(grep -c 'patch_final_clean(' patch_goodwy.py || true)
          if [ "${CNT:-0}" -lt 3 ]; then
            echo "::warning::patch_final_clean 疑似只接了 1 处(需 commons 分支 + app 分支各调一次)"
            echo "::warning::只清 app 侧 = commons 的 PurchaseActivity 和 BaseSimpleActivity 里的弹窗调用还在"
          fi
          python3 -c "import sys; print('python', sys.version.split()[0])"

      - name: Clone Goodwy-Commons
        run: |
          set -e
          # 关键: 必须 checkout app 实际锁定的那个 commons commit, 不能用 main。
          # commons main 已升到 AGP 9.3.1 / compileSdk 37 / lifecycle 2.11.0,
          # 而 app 还是 AGP 9.0.1 / compileSdk 36 —— 用 main 编出的 AAR 带
          # "requires compile against version 37" 元数据, app 侧 CheckAarMetadata 必挂。
          APP_TOML="$GITHUB_WORKSPACE/gradle/libs.versions.toml"
          PINNED=$(grep -oP '(?<=right-commons = ")[^"]+' "$APP_TOML" 2>/dev/null | head -1)
          APP_SDK=$(grep -oP '(?<=app-build-compileSDKVersion = ")[^"]+' "$APP_TOML" 2>/dev/null | head -1)
          REF="${{ inputs.commons_ref }}"
          [ -z "$REF" ] && REF="$PINNED"
          [ -z "$REF" ] && REF=main
          echo "app 锁定的 commons commit : ${PINNED:-未读到}"
          echo "app      compileSdk       : ${APP_SDK:-未读到}"
          echo "实际使用的 commons ref    : $REF"
          echo "APP_SDK=$APP_SDK" >> "$GITHUB_ENV"

          rm -rf "$RUNNER_TEMP/commons"
          mkdir -p "$RUNNER_TEMP/commons"
          cd "$RUNNER_TEMP/commons"
          git init -q
          git remote add origin https://github.com/Goodwy/Goodwy-Commons.git
          # 先试按 SHA 浅拉(快); 不支持则整仓 clone 再 checkout
          if ! git fetch -q --depth 1 origin "$REF"; then
            echo "按 SHA 浅拉失败, 改为整仓 clone"
            cd "$RUNNER_TEMP" && rm -rf commons && git clone -q https://github.com/Goodwy/Goodwy-Commons.git commons
            cd "$RUNNER_TEMP/commons"
            git checkout -q "$REF" || git checkout -q main
          else
            git checkout -q FETCH_HEAD
          fi
          echo "commons HEAD        : $(git rev-parse --short HEAD)"
          echo "commons compileSdk  : $(grep -oP '(?<=app-build-compileSDKVersion = ")[^"]+' gradle/libs.versions.toml)"

      - name: Patch commons (日期统一 + 关于页空壳 + 语言精简 + 斜体)
        run: |
          set -e
          FLAGS=""
          if [ "${{ inputs.trim_langs }}" != "true" ]; then FLAGS="$FLAGS --no-trim-langs"; fi
          if [ "${{ inputs.strip_about }}" != "true" ]; then FLAGS="$FLAGS --no-strip-about"; fi
          if [ "${{ inputs.sideload_trim }}" != "true" ]; then FLAGS="$FLAGS --no-sideload-trim"; fi
          if [ "${{ inputs.google_trim }}" != "true" ]; then FLAGS="$FLAGS --no-google-trim"; fi
          if [ "${{ inputs.dialog_trim }}" != "true" ]; then FLAGS="$FLAGS --no-dialog-trim"; fi
          if [ "${{ inputs.unlock_pro }}" != "true" ]; then FLAGS="$FLAGS --no-unlock-pro"; fi
          if [ "${{ inputs.keep_purchase_page }}" = "true" ]; then FLAGS="$FLAGS --keep-purchase-page"; fi
          if [ "${{ inputs.keep_speech }}" = "true" ]; then FLAGS="$FLAGS --keep-speech"; fi
          if [ "${{ inputs.italic_fix }}" != "true" ]; then FLAGS="$FLAGS --no-italic-fix"; fi
          LOCALES=""
          if [ -n "${{ inputs.locales }}" ]; then
            IFS=',' read -ra LS <<< "${{ inputs.locales }}"
            for L in "${LS[@]}"; do
              L_TRIM=$(echo "$L" | xargs)
              [ -n "$L_TRIM" ] && LOCALES="$LOCALES --locale $L_TRIM"
            done
          fi
          python3 patch_goodwy.py commons "$RUNNER_TEMP/commons" \
            --date-format "${{ inputs.date_format }}" \
            --date-mode "${{ inputs.date_mode }}" \
            --commons-version 99.0.0-custom --compile-sdk "$APP_SDK" $FLAGS $LOCALES

      - name: Publish commons to mavenLocal
        run: |
          set -e
          cd "$RUNNER_TEMP/commons"
          FLAVOR="${{ inputs.flavor }}"
          CAP="$(echo "${FLAVOR:0:1}" | tr 'a-z' 'A-Z')${FLAVOR:1}"
          chmod +x gradlew
          # strings 模块也要发, 否则 commons 的 POM 里会引用一个找不到的 strings 构件
          ./gradlew :strings:publishToMavenLocal \
                    ":commons:publish${CAP}ReleasePublicationToMavenLocal" \
                    -PVERSION=99.0.0-custom --no-daemon --stacktrace
          echo "--- mavenLocal 里的产物 ---"
          find ~/.m2/repository/com/github/goodwy -name "*.aar" -o -name "*.pom" | sort

      - name: Patch app (关于入口 + 语言 + 斜体 + 版本指向 + 收尾清理)
        run: |
          set -e
          FLAGS=""
          if [ "${{ inputs.trim_langs }}" != "true" ]; then FLAGS="$FLAGS --no-trim-langs"; fi
          if [ "${{ inputs.locale_filters }}" != "true" ]; then FLAGS="$FLAGS --no-locale-filters"; fi
          if [ "${{ inputs.strip_about }}" != "true" ]; then FLAGS="$FLAGS --no-strip-about"; fi
          if [ "${{ inputs.hide_datefmt }}" != "true" ]; then FLAGS="$FLAGS --no-hide-datefmt"; fi
          if [ "${{ inputs.abi_trim }}" != "true" ]; then FLAGS="$FLAGS --no-abi-trim"; fi
          if [ "${{ inputs.device_trim }}" != "true" ]; then FLAGS="$FLAGS --no-device-trim"; fi
          if [ "${{ inputs.purchase_trim }}" != "true" ]; then FLAGS="$FLAGS --no-purchase-trim"; fi
          if [ "${{ inputs.google_trim }}" != "true" ]; then FLAGS="$FLAGS --no-google-trim"; fi
          if [ "${{ inputs.dialog_trim }}" != "true" ]; then FLAGS="$FLAGS --no-dialog-trim"; fi
          if [ "${{ inputs.keep_speech }}" = "true" ]; then FLAGS="$FLAGS --keep-speech"; fi
          if [ "${{ inputs.italic_fix }}" != "true" ]; then FLAGS="$FLAGS --no-italic-fix"; fi
          PKGARG=""
          if [ -n "${{ inputs.package_name }}" ]; then
            PKGARG="--package-name ${{ inputs.package_name }}"
          fi
          LOCALES=""
          if [ -n "${{ inputs.locales }}" ]; then
            IFS=',' read -ra LS <<< "${{ inputs.locales }}"
            for L in "${LS[@]}"; do
              L_TRIM=$(echo "$L" | xargs)
              [ -n "$L_TRIM" ] && LOCALES="$LOCALES --locale $L_TRIM"
            done
          fi
          python3 patch_goodwy.py app "$GITHUB_WORKSPACE" \
            --date-format "${{ inputs.date_format }}" \
            --date-mode "${{ inputs.date_mode }}" \
            --commons-version 99.0.0-custom $FLAGS $LOCALES $PKGARG

      - name: Patch 自检 (源码改动 + 收尾清理, 日志里直接看是否干净)
        run: |
          # 说明: 全部用 || true, 避免 bash -e 下 grep 无匹配时把整个 step 打断
          CM="$RUNNER_TEMP/commons/commons/src/main/kotlin/com/goodwy/commons"
          echo "=== [1] 日期格式常量(应全部相同) ==="
          grep -h 'const val DATE_FORMAT_' "$CM/helpers/Constants.kt" | sort -u
          echo "=== [2] 波斯历残留(应为空) ==="
          grep -rn 'PersianDate\|Shamsi(' "$CM/extensions/Long.kt" || echo "(已清除)"
          echo "=== [3] 主菜单 about 入口(应不存在) ==="
          grep -A2 '@+id/about' app/src/main/res/menu/menu_main.xml || echo "(已移除)"
          echo "=== [4] 剩余语言目录 ==="
          ls app/src/main/res | grep '^values' | tr '\n' ' ' || true; echo
          echo "=== [5] 残留斜体(应为空: XML属性/Typeface/Compose FontStyle 全覆盖) ==="
          grep -rn 'textStyle="italic"\|Typeface\.ITALIC\|FontStyle\.Italic' \
            app/src "$RUNNER_TEMP/commons" --include=*.xml --include=*.kt \
            | grep -v detekt-baseline | head -10 || echo "(无残留)"
          echo "=== [5b] 应用主题默认值(应为 true: 跟随系统, 而非浅色) ==="
          if grep -A1 'var isSystemThemeEnabled' "$CM/helpers/BaseConfig.kt" \
             | grep -q 'IS_SYSTEM_THEME_ENABLED, true'; then
            echo "OK: 默认跟随系统 (Material You)"
          else
            echo "(仍是浅色, 检查 patch_baseconfig 第 6 项)"
          fi
          echo "=== [6] ABI 过滤 ==="
          grep -A2 'abiFilters' app/build.gradle.kts || echo "(未生效)"
          echo "=== [7] 非手机资源目录(应为空) ==="
          ls app/src/main/res | grep -E 'sw600dp|television|xlarge' || echo "(已清空)"
          echo "=== [8] 包名 ==="
          grep '^APP_ID' gradle.properties || true
          echo "=== [9] 签名弹窗调用(app, 应只剩 Unit) ==="
          grep -rn 'showSideloadingDialog' app/src --include=*.kt | grep -v '\bfun\b' || echo "(已全部置空)"
          echo "=== [10] 签名弹窗调用(commons, 应只剩 Unit) ==="
          grep -rn 'showSideloadingDialog' "$RUNNER_TEMP/commons" --include=*.kt | grep -v '\bfun\b' || echo "(已全部置空)"
          echo "=== [11] 内购 Key(应为空) ==="
          if [ -f local.properties ]; then
            grep -iE 'RIGHT_APP_KEY|PRODUCT_ID|SUBSCRIPTION|BILLING|LICENSE_KEY' local.properties || echo "(无内购字段)"
          else
            echo "(local.properties 尚未生成, 由 gradle 在构建时创建)"
          fi
          echo "=== [12] 收费入口(应为 gone) ==="
          grep -A1 'settingsPurchaseThankYouHolder\|settingsTipJarHolder' app/src/main/res/layout/activity_settings.xml || echo "(已移除)"
          echo "=== [13] 购买页 onCreate(应为 finish) ==="
          grep -rln 'finish()  // 购买页已精简' "$RUNNER_TEMP/commons" app/src || echo "(未找到, 检查 PurchaseActivity 路径)"
          echo "=== [14] 内购文案残留(应为空: 内容已被清空) ==="
          grep -rE '<string name="[^"]*(purchase|thank_you|tip_jar|tipjar|donate|donation)[^"]*">[^<]+<' \
            "$RUNNER_TEMP/commons" app/src/main/res 2>/dev/null || echo "(已全部清空)"
          echo "=== [15] 付费渠道源集(保留无害: 不参与 foss 构建, 不进 APK) ==="
          ls -d app/src/gplay app/src/rustore 2>/dev/null || echo "(无 gplay/rustore 源集)"
          echo "=== [16] 语音输入残留(commons 已抽空, 残留不报错但需人工确认) ==="
          grep -rn 'isSpeechToTextAvailable\|speechToText' app/src --include=*.kt \
            | grep -vE 'useSpeechToText|UseSpeechToText' || echo "(app 侧已无引用)"
          echo "=== [17] commons 语音函数(应为 return false / 空实现) ==="
          grep -A2 'fun Activity.isSpeechToTextAvailable' \
            "$RUNNER_TEMP/commons/commons/src/main/kotlin/com/goodwy/commons/extensions/Activity.kt" \
            || echo "(未找到, 检查路径)"
          echo "=== [18] Android 16 三档 SDK(应全为 36) ==="
          grep -E 'app-build-(compileSDKVersion|targetSDK|minimumSDK)' \
            gradle/libs.versions.toml
          echo "=== [19] lifecycle(compileSdk 36 下必须是 2.10.0) ==="
          grep -E 'androidx-lifecycle' gradle/libs.versions.toml || echo "(未找到)"
          echo "=== [20] 16KB 页大小(Android 16 强制) ==="
          grep -A2 'useLegacyPackaging' app/build.gradle.kts || echo "(未启用)"

      - name: Build release APK
        run: |
          set -e
          FLAVOR="${{ inputs.flavor }}"
          CAP="$(echo "${FLAVOR:0:1}" | tr 'a-z' 'A-Z')${FLAVOR:1}"
          TASK="assemble${CAP}Release"
          echo "构建任务: $TASK"
          chmod +x gradlew
          # 三个渠道的 KSP 会并发写同一个 app/schemas/*.json, 互相读半截内容会报
          # "Expected end of the object ...". 只构建单渠道 + 清掉历史残留即可避开。
          rm -rf app/schemas
          # 编译失败时 Gradle 会甩出上百行 worker 栈, 真正有用的 Kotlin 报错
          # (e: 文件:行:列: ...) 被埋在最底下。这里 tee 一份, 失败时单独抽出来打,
          # 免得每次都要在几千行栈里捞那几行。
          set +e
          ./gradlew "$TASK" --no-daemon --no-parallel --stacktrace 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::group::编译错误明细 (Kotlin)"
            grep -E '^e: ' build.log | sort -u | head -40 || echo "(未抓到 e: 行, 见下方 what went wrong)"
            echo "--- what went wrong ---"
            grep -A8 'What went wrong' build.log | head -20 || true
            echo "::endgroup::"
            exit "$RC"
          fi
          echo "=== 构建产物 ==="
          find app/build/outputs/apk -name "*.apk" -print
          # KSP 2.3.5 的已知 bug: 处理结束后, IntelliJ PSI 的后台清理线程
          # (AWT-EventQueue-0) 在 Application 已销毁后仍去取服务, 抛 NPE。
          # 抛在 AWT 线程而非构建主线程, Gradle 捕获不到, 不影响产物 ——
          # 官方 issue google/ksp#2763 标题即 "does not break build"。
          # 这里不静默吞掉, 只标注清楚, 免得每次看到红字都以为是新问题。
          if grep -q 'ApplicationManager.getApplication()' build.log; then
            echo "::notice::检测到 KSP 已知非致命异常 (google/ksp#2763): 抛在 AWT "
            echo "         后台线程, 不影响 APK。彻底消除需等 KSP 升到 2.3.5 以上。"
          fi

      - name: Sign APK
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"
          APK=$(find app/build/outputs/apk -name "*.apk" | grep -i release | grep -vi unsigned | head -1)
          if [ -z "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*unsigned.apk" | head -1)
          fi
          if [ -z "$APK" ]; then echo "::error::没找到 release APK"; exit 1; fi
          echo "source apk: $APK"
          keytool -genkeypair -v -keystore custom.jks -keyalg RSA -keysize 2048 \
            -validity 10950 -alias custom -storepass android -keypass android \
            -dname "CN=Custom, OU=Custom, O=Custom, L=X, ST=X, C=CN"
          "${BT}zipalign" -p -f 4 "$APK" aligned.apk
          "${BT}apksigner" sign --ks custom.jks --ks-key-alias custom \
            --ks-pass pass:android --key-pass pass:android \
            --out RightMessages-custom.apk aligned.apk
          "${BT}apksigner" verify RightMessages-custom.apk || true
          ls -lh RightMessages-custom.apk
          echo "=== APK 实际支持的语言 ==="
          "${BT}aapt2" dump badging RightMessages-custom.apk | grep -i "^locales" || echo "(未取到, 忽略)"
          echo "=== APK 内购痕迹(应为空: 否则开源商店会判含内购) ==="
          "${BT}aapt2" dump badging RightMessages-custom.apk \
            | grep -iE 'vending\.BILLING|billingclient' || echo "(无 BILLING 权限, 可被开源商店收录)"

      - name: APK 体积构成
        run: |
          set -e
          APK=RightMessages-custom.apk
          [ -f "$APK" ] || { echo "没有 APK 可分析"; exit 0; }
          echo "总大小: $(du -h "$APK" | cut -f1)"
          python3 - "$APK" <<'PY'
          import sys, zipfile, collections, os
          z = zipfile.ZipFile(sys.argv[1])
          infos = z.infolist()
          tot = sum(i.file_size for i in infos)
          ctot = sum(i.compress_size for i in infos)
          print("\n=== 按类型汇总 (原始 / 压缩后) ===")
          agg = collections.defaultdict(lambda: [0, 0])
          for i in infos:
              n = i.filename
              if n.startswith("lib/"):
                  k = "lib/*.so (原生库)"
              elif n.startswith("classes") and n.endswith(".dex"):
                  k = "classes*.dex (代码)"
              elif n == "resources.arsc":
                  k = "resources.arsc (资源表)"
              elif n.startswith("res/"):
                  k = "res/ (资源文件)"
              elif n.startswith("assets/"):
                  k = "assets/"
              elif n.startswith("META-INF/"):
                  k = "META-INF/ (签名/元数据)"
              elif n == "AndroidManifest.xml":
                  k = "AndroidManifest.xml"
              else:
                  k = "其它"
              agg[k][0] += i.file_size
              agg[k][1] += i.compress_size
          for k, (a, b) in sorted(agg.items(), key=lambda x: -x[1][0]):
              print("  %-26s %8.1f MB  (压缩后 %8.1f MB)" % (k, a/1048576, b/1048576))
          print("  %-26s %8.1f MB  (压缩后 %8.1f MB)" % ("合计", tot/1048576, ctot/1048576))
          print("\n=== 体积 Top 12 ===")
          for i in sorted(infos, key=lambda x: -x.file_size)[:12]:
              r = "" if not i.file_size else "  压缩率 %d%%" % (100 - i.compress_size*100/i.file_size)
              print("  %7.2f MB  %s%s" % (i.file_size/1048576, i.filename, r))
          print("\n=== 未压缩条目(STORED) ===")
          st = [i for i in infos if i.compress_type == 0]
          if st:
              for i in sorted(st, key=lambda x: -x.file_size)[:8]:
                  print("  %7.2f MB  %s" % (i.file_size/1048576, i.filename))
              print("  (共 %d 个, 合计 %.1f MB) —— 未压缩条目会被对齐填充放大"
                    % (len(st), sum(i.file_size for i in st)/1048576))
          else:
              print("  (无)")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RightMessages-custom
          path: RightMessages-custom.apk
